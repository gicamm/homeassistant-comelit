# This repository is a Home Assistant custom integration, not a distributable
# Python package: Home Assistant loads `custom_components/comelit` directly and
# resolves its runtime dependencies from `custom_components/comelit/manifest.json`.
# This file therefore carries no build backend and no `[project]` table - it only
# configures the development tooling (dev dependencies, ruff, pytest, coverage).


# PEP 735 dependency groups (pip >= 25.1):
#   pip install --group dev    # everything, for local development
#   pip install --group lint   # just ruff, for the lint CI job
#   pip install --group test   # test runtime, for the test CI job
[dependency-groups]
lint = ["ruff"]

test = [
    # Home Assistant is only needed to run the tests: the integration's real
    # runtime requirements are declared in custom_components/comelit/manifest.json.
    # pytest-homeassistant-custom-component pins the matching Home Assistant
    # release, so bump both lines together.
    "homeassistant==2025.4.4",
    "paho-mqtt",
    "wrapt-timeout-decorator",
    "dill",
    "wrapt",
    "module-wrapper",
    "multiprocess",
    "pytest-homeassistant-custom-component==0.13.236",
    "pytest-asyncio",
    "pytest-cov",
]

dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "debug",
    "venv",
    "test",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "T20",    # flake8-print
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
]
ignore = [
    "E501",  # line length is handled by the formatter

    # TODO: the rules below are violated by the current code base and are
    # disabled so CI stays green. Remove them one at a time as the code is
    # cleaned up (`ruff check . --select <RULE>` shows what is left).
    "G001",    # logging statement uses str.format
    "G004",    # logging statement uses f-string (use lazy %s formatting)
    "PTH110",  # os.path.exists() -> Path.exists()
    "PTH118",  # os.path.join() -> Path / operator
    "PTH120",  # os.path.dirname() -> Path.parent
    "PTH123",  # open() -> Path.open()
    "RET504",  # unnecessary assignment before return
    "RUF046",  # unnecessary cast to int
    "SIM102",  # collapsible if
    "SIM105",  # use contextlib.suppress
    "SIM108",  # use ternary operator
    "UP030",   # use implicit references for positional format fields
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["custom_components/comelit"]
branch = true
omit = [
    "custom_components/comelit/__pycache__/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
